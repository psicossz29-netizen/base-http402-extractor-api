name: Base L2 USDC Balance Monitor & Milestone Tracker

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-balance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and Check Balance
        run: |
          npm run build
          node -e "
            const { runWalletCheck } = require('./dist/scripts/autonomous_daemon.js');
            runWalletCheck().then(reached => {
              if (reached) console.log('Target reached!');
              process.exit(0);
            }).catch(err => {
              console.error(err);
              process.exit(0); // Evitar que caídas temporales de RPC marquen fallo crítico
            });
          " || npx tsx scripts/autonomous_daemon.ts --once || true

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.json data/ || true
          git diff --staged --quiet || (git commit -m "chore(monitor): update balance and milestone progress [skip ci]" && git push)
